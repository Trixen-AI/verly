# ============================================================================
# Netlify deployment
# ============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Matches the local toolchain. Vite 8 and the TypeScript build need modern Node.
  NODE_VERSION = "22"
  # devDependencies are required: the build runs `tsc -b` before `vite build`.
  NPM_FLAGS = "--include=dev"

# ---------------------------------------------------------------------------
# SPA fallback. Routing happens client side, so a direct hit on /app/deposit or
# /docs/network must serve index.html instead of 404.
# `public/_redirects` carries the same rule for portability to other hosts;
# identical rules are harmless, and Netlify processes _redirects first.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # This app signs transactions, so being framed by a third party is a real
    # clickjacking risk. NOTE: if you later want the dapp to run inside a Safe
    # App or an embedded wallet browser, that requires framing. Remove this
    # header at that point, not before.
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Vite fingerprints every asset filename, so these can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The entry point must never be cached, or a deploy will not reach returning
# visitors until their cache expires.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
