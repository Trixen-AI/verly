  <body>
    <!-- Arm the reveal animations before first paint so elements never flash
         in and then jump. Skipped entirely under prefers-reduced-motion, and
         a no-JS visitor simply keeps everything visible. -->
    <script>
      try {
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('js-motion')
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
